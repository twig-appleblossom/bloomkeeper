<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bloomkeeper</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <!-- TODAY SCREEN -->
      <section id="today-screen">
        <header>
          <p class="eyebrow">🌸 Bloomkeeper</p>
          <h1>☀️ Today</h1>
        </header>

        <div id="today-list" class="today-list">
          <!-- JavaScript will put today's Seeds here -->
        </div>

        <div id="one-off-form" class="one-off-form hidden">
          <label for="one-off-input"> What needs doing? </label>

          <input id="one-off-input" type="text" placeholder="Buy eyeliner..." />

          <div class="one-off-actions">
            <button id="cancel-one-off" class="secondary-button">Cancel</button>

            <button id="save-one-off" class="primary-button">
              Add to Today
            </button>
          </div>
        </div>

        <div class="actions">
          <button id="add-one-off" class="secondary-button">+ One-Off</button>

          <button id="open-seed-bank" class="primary-button">
            🌱 Seed Bank
          </button>
        </div>
      </section>

      <!-- SEED BANK SCREEN -->
      <section id="seed-bank-screen" class="hidden">
        <header>
          <p class="eyebrow">🌱 Bloomkeeper</p>
          <h1>Seed Bank</h1>
          <p class="subtitle">
            Choose something you'd like to bring into today.
          </p>
        </header>

        <div id="seed-list" class="seed-list">
          <!-- JavaScript will put Seeds here -->
        </div>

        <button id="open-seed-form" class="primary-button">+ Add Seed</button>

        <div id="seed-form" class="seed-form hidden">
          <label for="seed-input"> Seed name </label>

          <input
            id="seed-input"
            type="text"
            placeholder="🌸 Practice something..."
          />

          <div class="seed-form-actions">
            <button id="cancel-seed" class="secondary-button">Cancel</button>

            <button id="save-seed" class="primary-button">Add Seed</button>
          </div>
        </div>

        <button id="back-to-today" class="secondary-button">
          ← Back to Today
        </button>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
