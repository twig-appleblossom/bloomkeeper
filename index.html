<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bloomkeeper</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <!-- TODAY SCREEN -->
      <section id="today-screen">
        <header>
          <p class="eyebrow">🌸 Bloomkeeper</p>
          <h1>☀️ Today</h1>
        </header>

        <div id="today-list" class="today-list">
          <!-- JavaScript will put today's Seeds here -->
        </div>

        <div class="actions">
          <button class="secondary-button" disabled>+ One-Off</button>

          <button id="open-seed-bank" class="primary-button">
            🌱 Seed Bank
          </button>
        </div>
      </section>

      <!-- SEED BANK SCREEN -->
      <section id="seed-bank-screen" class="hidden">
        <header>
          <p class="eyebrow">🌱 Bloomkeeper</p>
          <h1>Seed Bank</h1>
          <p class="subtitle">
            Choose something you'd like to bring into today.
          </p>
        </header>

        <div id="seed-list" class="seed-list">
          <!-- JavaScript will put Seeds here -->
        </div>

        <button id="back-to-today" class="secondary-button">
          ← Back to Today
        </button>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
